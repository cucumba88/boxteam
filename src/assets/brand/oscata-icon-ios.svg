<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Oscata">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d1d26"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="ring" x1="160" y1="160" x2="864" y2="864" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4baff"/>
      <stop offset="0.45" stop-color="#7c6ef7"/>
      <stop offset="1" stop-color="#4a3fd4"/>
    </linearGradient>
    <radialGradient id="haze" cx="360" cy="340" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6ef7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c6ef7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- iOS handles its own corner-rounding on apple-touch-icon, so we fill the
       full 1024×1024 canvas with the squircle background and a larger ring.
       Ring radius = 420 / 1024 = 82% of canvas (vs ~54% in the macOS tile),
       which keeps the glyph visually similar in size to other iOS app icons.
       The notch (16° arc) sits at ~2 o'clock, mirroring the desktop mark. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#haze)"/>
  <path d="M 628 108 A 420 420 0 1 0 804 210"
        fill="none"
        stroke="url(#ring)"
        stroke-width="144"
        stroke-linecap="round"/>
</svg>
