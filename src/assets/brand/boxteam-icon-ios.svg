<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="BoxTeam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d1d26"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="ring" x1="160" y1="160" x2="864" y2="864" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4baff"/>
      <stop offset="0.45" stop-color="#7c6ef7"/>
      <stop offset="1" stop-color="#4a3fd4"/>
    </linearGradient>
    <radialGradient id="haze" cx="380" cy="340" r="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6ef7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c6ef7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background fills the full canvas. Ring uses a heavy stroke (180 =
       ~18% of canvas) so the visual mass survives downscaling — iOS
       renders home-screen icons at ~60-80 logical px, where a thin stroke
       (~12% of canvas) becomes a hairline and the mark reads as small
       compared to solid-content competitors like Spotify or WubbaLubba.
       At r=360 with stroke 180 the outer edge sits at ~88% of canvas
       (450/512) and the visible ring band is ~35% of canvas wide. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#haze)"/>
  <path d="M 611 166 A 360 360 0 1 0 762 253"
        fill="none"
        stroke="url(#ring)"
        stroke-width="180"
        stroke-linecap="round"/>
</svg>
