services:
  boxteam:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: boxteam
    ports:
      - "47860:47860"
    environment:
      BOXTEAM_WEBGUI_PORT: "47860"
      BOXTEAM_WEBGUI_EXPOSED_PORT: "47860"  # cambia al puerto externo si usas un proxy inverso
    volumes:
      - boxteam-config:/config
      - boxteam-downloads:/downloads
    restart: unless-stopped

volumes:
  boxteam-config:
  boxteam-downloads:
