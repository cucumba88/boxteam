<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>BoxTeam</title>
    <meta
      name="description"
      content="Gestiona tu biblioteca de medios FTP con enriquecimiento TMDB y cola de descargas."
    />
    <meta name="theme-color" content="#7c6ef7" />
    <meta name="color-scheme" content="dark light" />
    <!-- iOS standalone-app metadata: hides the Safari chrome when launched
         from the home screen, and tells iOS the status bar should adopt the
         dark app background instead of the default white. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BoxTeam" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="/icons/icon-128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512.png"
    />
    <!-- iOS uses apple-touch-icon for the home-screen tile. 180×180 is the
         current iPhone size; iOS will round its corners itself, so the PNG
         must fill the full canvas with no inner safe-area padding (otherwise
         the glyph looks too small inside the iOS-applied squircle). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/icons/icon-256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <!-- Open Graph -->
    <meta property="og:title" content="BoxTeam" />
    <meta
      property="og:description"
      content="Biblioteca de medios FTP con TMDB y cola de descargas."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
