[package]
name = "boxteam"
version = "0.22.5"
description = "BoxTeam — visual media library client for FTP servers"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boxteam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
suppaftp = { version = "13", features = ["tokio-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
jiff = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
urlencoding = "2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip", "compression-br"] }
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
async-trait = "0.1"
socket2 = "0.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
