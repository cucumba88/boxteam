name: Telegram release

# Announces each release on Telegram: a message with the highlights from the
# release notes, direct download links to the installers and a link to the
# release page.
#
# Runs after a successful Release run (release.yml) of a v* tag: by then every
# check and build has passed and the release has been published. The script
# still checks the release is complete (.exe + Linux packages attached) and
# posts once per release (scripts/telegram-release.mjs leaves a hidden marker
# in the release notes). To skip one release, add <!-- no-telegram --> to
# its notes; the next announced release then also carries its notes.
#
# Needs the repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. Without them
# it does nothing.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    # Only release tags (head_branch is the tag name). A manual Windows
    # re-run for a release builds from main, so it doesn't trigger this:
    # run this workflow by hand afterwards if needed.
    branches: ["v*"]
  # Manual run: re-post a release, or preview the message (dry run).
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release (p. ej. v0.18.0). Vacío = la última"
        required: false
        default: ""
      dry_run:
        description: "Solo vista previa: no envía nada, deja el mensaje en el resumen"
        type: boolean
        default: true
      force:
        description: "Publicar aunque ya se hubiera publicado o falte algún build"
        type: boolean
        default: false
      edit_message_id:
        description: "Id de un anuncio ya publicado para reescribirlo con el formato actual (no publica otro)"
        required: false
        default: ""

# Serialise runs per release so two builds finishing together can't both post.
concurrency:
  group: telegram-release-${{ github.event.workflow_run.head_branch || inputs.release_tag || 'latest' }}
  cancel-in-progress: false

jobs:
  announce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Override with the repo variable LINUX_RUNNER_LABELS (JSON array).
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted", "linux", "x64", "unraid"]') }}
    timeout-minutes: 30
    permissions:
      contents: write # read the release, add the "posted" marker
      actions: read # check the Docker build of the tag

    steps:
      # Into its own folder: a sparse checkout of the shared runner workspace
      # left the next build on the self-hosted runner without package-lock.json.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: _telegram
          sparse-checkout: |
            scripts/telegram-release.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post to Telegram
        run: node _telegram/scripts/telegram-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # A manual Windows re-run builds from main, so head_branch isn't the
          # tag; the script then falls back to the latest release.
          RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
          APP_NAME: BoxTeam
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}
          EDIT_MESSAGE_ID: ${{ inputs.edit_message_id }}
