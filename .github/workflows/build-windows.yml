name: Build Windows

# Cross-compiles the Windows installer (NSIS) and the portable zip on the
# Unraid self-hosted Linux runner with cargo-xwin, instead of windows-latest.
# Tauri: https://v2.tauri.app/distribute/windows-installer/#build-windows-apps-on-linux-and-macos
on:
  # Release tags (v*): called by release.yml after the CI checks pass.
  workflow_call:
  # Builds (without publishing) on PRs that touch the Windows pipeline, so a
  # change can be verified on the Unraid runner before it reaches main.
  pull_request:
    paths:
      - .github/workflows/build-windows.yml
      - scripts/build-portable-windows.sh
  # Manual run. With release_tag, builds that tag's source using this
  # (newer) workflow and attaches the .exe/.zip to that tag's release, e.g.
  # to fill in a release whose Windows build failed.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de una release existente a la que adjuntar los .exe (p. ej. v0.16.0)"
        required: false
        default: ""

# A newer manual or PR run for the same ref replaces an older one; release tag builds are never cancelled.
concurrency:
  group: build-windows-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    # Never run code from a fork on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Override with the repo variable LINUX_RUNNER_LABELS (JSON array).
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted", "linux", "x64", "unraid"]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # Build helpers from the workflow's own commit. With release_tag the
      # source above is an older tag that may not have them yet.
      - name: Checkout CI helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _ci
          sparse-checkout: |
            scripts/nsis-include/
            scripts/release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-cross

      - name: Install cross-compile toolchain (NSIS, LLVM, clang-cl)
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends nsis lld llvm clang clang-tools zip
          # cargo-xwin wants unversioned clang-cl, lld-link, llvm-lib and llvm-rc.
          # Depending on the release, Debian/Ubuntu ship them only as
          # /usr/bin/clang-cl-NN or only under /usr/lib/llvm-NN/bin (Ubuntu
          # 22.04 / clang 14, where clang-cl lives in clang-tools). Put the
          # newest LLVM bin dir first on PATH.
          LLVM_BIN=$(ls -d /usr/lib/llvm-*/bin 2>/dev/null | sort -V | tail -1)
          if [ -n "$LLVM_BIN" ]; then
            echo "$LLVM_BIN" >> "$GITHUB_PATH"
            export PATH="$LLVM_BIN:$PATH"
          fi
          if ! command -v clang-cl >/dev/null; then
            CL=$(ls /usr/bin/clang-cl-* 2>/dev/null | sort -V | tail -1)
            [ -n "$CL" ] && $SUDO ln -sf "$CL" /usr/local/bin/clang-cl
          fi
          for tool in clang-cl lld-link llvm-lib llvm-rc; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not found after installing LLVM"; exit 1; }
          done
          clang-cl --version | head -1
          # NSIS < 3.09 (Ubuntu 22.04 ships 3.08) lacks Win\RestartManager.nsh,
          # which Tauri's installer template includes. Add our backport only
          # if makensis doesn't already have it.
          NSIS_INC=/usr/share/nsis/Include
          if [ ! -f "$NSIS_INC/Win/RestartManager.nsh" ]; then
            $SUDO install -D -m 644 _ci/scripts/nsis-include/Win/RestartManager.nsh "$NSIS_INC/Win/RestartManager.nsh"
          fi
          makensis -VERSION

      - name: Install cargo-xwin
        run: command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked

      # The MSVC CRT + Windows SDK that cargo-xwin downloads (~1 GB) is kept
      # between runs so only the first build pays for it.
      - name: Cache xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-v1

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (NSIS installer)
        run: npm run tauri build -- --runner cargo-xwin --target "$TARGET"
        env:
          # Signs the updater packages (.sig next to the installer) that
          # the in-app updater verifies against the pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Pack portable zip
        run: bash scripts/build-portable-windows.sh --target "$TARGET"

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: boxteam-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            boxteam-windows-portable-*.zip
          retention-days: 30

      # Release tags: into the draft that release.yml publishes. With
      # release_tag: into that (already published) release.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          node _ci/scripts/release-assets.mjs upload "$RELEASE_TAG" \
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe \
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig \
            boxteam-windows-portable-*.zip
