name: Build Windows

# Cross-compiles the Windows installer (NSIS) and the portable zip on the
# Unraid self-hosted Linux runner with cargo-xwin, instead of windows-latest.
# Tauri: https://v2.tauri.app/distribute/windows-installer/#build-windows-apps-on-linux-and-macos
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Builds (without publishing) on PRs that touch the Windows pipeline, so a
  # change can be verified on the Unraid runner before it reaches main.
  pull_request:
    paths:
      - .github/workflows/build-windows.yml
      - scripts/build-portable-windows.sh
  workflow_dispatch:

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    # Never run code from a fork on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Override with the repo variable LINUX_RUNNER_LABELS (JSON array).
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted", "linux", "x64", "unraid"]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-cross

      - name: Install cross-compile toolchain (NSIS, LLVM, clang-cl)
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends nsis lld llvm clang zip
          # Debian/Ubuntu only ship versioned clang-cl (clang-cl-18…); cargo-xwin wants `clang-cl`.
          if ! command -v clang-cl >/dev/null; then
            CL=$(ls /usr/bin/clang-cl-* | sort -V | tail -1)
            $SUDO ln -sf "$CL" /usr/local/bin/clang-cl
          fi

      - name: Install cargo-xwin
        run: command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked

      # The MSVC CRT + Windows SDK that cargo-xwin downloads (~1 GB) is kept
      # between runs so only the first build pays for it.
      - name: Cache xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-v1

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (NSIS installer)
        run: npm run tauri build -- --runner cargo-xwin --target "$TARGET"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Pack portable zip
        run: bash scripts/build-portable-windows.sh --target "$TARGET"

      - name: Upload artifacts (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: oscata-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            oscata-windows-portable-*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            oscata-windows-portable-*.zip
