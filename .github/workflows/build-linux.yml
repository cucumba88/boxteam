name: Build Linux

# Called by release.yml for release tags (v*), only after the CI checks pass;
# it attaches the packages to the release draft that release.yml publishes
# once every build is done. Run it by hand (workflow_dispatch) to get the
# artifacts for a branch.
on:
  workflow_call:
  workflow_dispatch:

# A newer manual run for the same ref replaces an older one; release tag builds are never cancelled.
concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-linux:
    # Unraid self-hosted runner. Override the labels with the repo variable
    # LINUX_RUNNER_LABELS (JSON array), e.g. '["ubuntu-22.04"]' to go back to GitHub.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted", "linux", "x64", "unraid"]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          # Self-hosted runner containers often run as root without sudo.
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            rpm \
            curl wget file

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (deb, rpm, AppImage)
        run: npm run tauri build -- --bundles deb,rpm,appimage
        env:
          # linuxdeploy is itself an AppImage; inside a container there is no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Signs the updater packages (.sig next to the installer) that
          # the in-app updater verifies against the pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Pack tar.gz (binary + dist + resources)
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCH=amd64
          STAGE="boxteam_${VERSION}_linux_${ARCH}"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/boxteam "$STAGE/"
          cp -r dist "$STAGE/dist"
          cp -r src-tauri/resources "$STAGE/resources"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          ls -lh "${STAGE}.tar.gz"

      - name: Upload artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: boxteam-linux-amd64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            boxteam_*_linux_amd64.tar.gz
          retention-days: 30

      - name: Attach to the release draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          node scripts/release-assets.mjs upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            boxteam_*_linux_amd64.tar.gz
