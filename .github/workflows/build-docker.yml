name: Build Docker

# Called by release.yml for release tags (v*), only after the CI checks and the
# Linux and Windows builds pass, so `latest` never moves to a broken release.
# Run it by hand (workflow_dispatch) to get an image for a branch.
on:
  workflow_call:
  workflow_dispatch:

# A newer manual or PR run for the same ref replaces an older one; release tag builds are never cancelled.
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/boxteam

jobs:
  build-docker:
    # Unraid self-hosted runner. Override the labels with the repo variable
    # LINUX_RUNNER_LABELS (JSON array), e.g. '["ubuntu-latest"]' to go back to GitHub.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted", "linux", "x64", "unraid"]') }}
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: vX.Y.Z, vX.Y and latest on release tags; the branch name on manual runs
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache: the rust-cache stage (all dep crates) is stored in
          # a dedicated cache image and reused as long as Cargo.toml/Cargo.lock
          # haven't changed — no matter which CI runner picks up the job.
          cache-from: type=registry,ref=${{ env.IMAGE }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}-buildcache,mode=max
